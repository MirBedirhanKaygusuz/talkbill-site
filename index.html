<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talkbill</title>
<style>
  :root {
    --bg: #ffffff; --fg: #1c1c1e; --muted: #6b6b70;
    --accent: #34c759; --card: #f5f5f7; --line: #e3e3e6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #000000; --fg: #f2f2f7; --muted: #9a9aa0;
            --accent: #30d158; --card: #1c1c1e; --line: #2c2c2e; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 2.5rem 1.25rem 4rem;
    background: var(--bg); color: var(--fg);
    font: 17px/1.65 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 42rem; margin: 0 auto; }
  h1 { font-size: 2rem; line-height: 1.2; margin: 0 0 .35rem; letter-spacing: -.02em; }
  .sub { color: var(--muted); margin-bottom: 2.5rem; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { margin: .6rem 0; }
  a.card {
    display: block; background: var(--card); border-radius: 12px;
    padding: 1rem 1.15rem; text-decoration: none; color: var(--fg);
    border-left: 4px solid var(--accent);
  }
  a.card span { display: block; color: var(--muted); font-size: .95rem; margin-top: .15rem; }
  footer { margin-top: 3rem; padding-top: 1.25rem; border-top: 1px solid var(--line);
           color: var(--muted); font-size: .9rem; }
  footer a { color: var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Talkbill</h1>
  <p class="sub">Speak the job, get the invoice.</p>
  <ul>
    <li><a class="card" href="support.html">Support<span>Getting a good result, problems, billing</span></a></li>
    <li><a class="card" href="privacy.html">Privacy Policy<span>What Talkbill collects — nothing</span></a></li>
    <li><a class="card" href="terms.html">Terms of Use<span>What Talkbill is, and what stays your responsibility</span></a></li>
  </ul>
  <footer>Questions: <a href="mailto:kaygusuzmir79@gmail.com">kaygusuzmir79@gmail.com</a></footer>
</main>
</body>
</html>
